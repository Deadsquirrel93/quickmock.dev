{{/* HTMX partial endpoint: GET /mock/:slug/logs.
     Renders the method and status filters, the "download JSON" link
     (carrying the same ?method= / ?status= as the list below it), and the
     log list. No base layout, and no <script>: htmx runs swapped-in scripts
     at settle time and throws when an overlapping swap has already detached
     them. The box's own wiring (hx-include, which picks up these filters) is
     static on #qm-logs in mock.html. */}}
{{ define "partials_logs" }}
<div class="card-header">
  <select id="log-filter-method" class="log-filter" name="method" aria-label="{{ t "logs.filter.method" }}"
          hx-get="/mock/{{ .Mock.Slug }}/logs" hx-target="#qm-logs" hx-swap="innerHTML" hx-trigger="change">
    <option value=""{{ if eq .Method "" }} selected{{ end }}>{{ t "logs.filter.all_methods" }}</option>
    {{ range .FilterMethods }}
    <option value="{{ . }}"{{ if eq (print .) $.Method }} selected{{ end }}>{{ . }}</option>
    {{ end }}
  </select>
  <select id="log-filter-status" class="log-filter" name="status" aria-label="{{ t "logs.filter.status" }}"
          hx-get="/mock/{{ .Mock.Slug }}/logs" hx-target="#qm-logs" hx-swap="innerHTML" hx-trigger="change">
    <option value="0"{{ if eq .Status 0 }} selected{{ end }}>{{ t "logs.filter.all_statuses" }}</option>
    {{/* Options come from the handler (logFilterStatusOptions), which folds
         the status currently being filtered on into the shortlist — a mock
         can answer with any code, and an option that isn't rendered can't be
         marked selected. */}}
    {{ range .FilterStatuses }}
    <option value="{{ . }}"{{ if eq . $.Status }} selected{{ end }}>{{ . }}</option>
    {{ end }}
  </select>
  <a class="btn btn-ghost" href="/mock/{{ .Mock.Slug }}/logs/export{{ if or .Method (ne .Status 0) }}?{{ if .Method }}method={{ .Method }}{{ end }}{{ if ne .Status 0 }}{{ if .Method }}&amp;{{ end }}status={{ .Status }}{{ end }}{{ end }}">{{ t "logs.export.button" }}</a>
</div>
{{ template "logs_inner" . }}
{{ end }}
