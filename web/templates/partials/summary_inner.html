{{ define "summary_inner" }}
<div class="summary-grid">
  <div>
    <div class="stat-label">{{ t "mock.detail.requests" }}</div>
    <div class="stat-value">{{ .Mock.RequestCount }}</div>
  </div>
  <div>
    <div class="stat-label">{{ t "mock.detail.last_request" }}</div>
    <div class="stat-value">{{ if .Mock.LastRequestAt }}{{ fmtTime .Mock.LastRequestAt }}{{ else }}{{ t "mock.detail.never" }}{{ end }}</div>
  </div>
</div>
{{ end }}
